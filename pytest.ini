[pytest]
minversion = 8.0
testpaths = tests
pythonpath = src .

addopts =
    -ra
    -q
    --strict-markers
    --tb=short
    --junitxml=reports/junit/test-results.xml
    --alluredir=reports/allure-results

markers =
    smoke: Quick sanity / smoke validation across core journeys
    regression: Comprehensive test coverage for release verification
    authentication: Tests for login, logout, and session lifecycle
    admin: User administration and system management scenarios
    pim: Personnel Information Management (Employee lifecycle) scenarios
    leave: Leave entitlement, application, and approval workflows
    recruitment: Candidate management and vacancy workflows
    self_service: My Info and employee profile management
    authorization: Role-based access control and UI permissions
    workflow: Multi-step cross-module end-to-end business journeys
    negative: Negative testing, boundary analysis, and validation enforcement
    slow: Tests with extensive multi-step operations or state polling

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] (%(name)s) %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest-execution.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] [%(threadName)s] %(filename)s:%(lineno)d: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
