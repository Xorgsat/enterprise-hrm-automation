name: Scheduled Health & Smoke Verification

on:
  schedule:
    # Runs at 04:00 UTC daily (low-traffic window)
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduled-smoke:
    name: Daily Production Health Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Smoke Suite (Non-Destructive)
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://opensource-demo.orangehrmlive.com' }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'Admin' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'admin123' }}
          HEADLESS: "true"
          LOG_LEVEL: "INFO"
        run: |
          pytest -m smoke -v --junitxml=reports/junit/scheduled-smoke.xml

      - name: Retain Execution Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-failure-diagnostics
          path: |
            reports/junit/
            artifacts/screenshots/
            logs/
